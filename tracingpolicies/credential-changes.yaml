apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "detect-credential-changes"
spec:
  lsm:
    - call: "security_task_fix_setuid"
      args:
        - index: 0
          type: "cred"        # the new credential struct being applied
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotEqual"
              values:
                - "0"          # ignore no-op transitions to uid 0->0 if noisy; tune as needed
          matchActions:
            - action: Post
